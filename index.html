<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>JhoneVic Bank</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%;
    width: 100%;
    overflow: hidden;
    overscroll-behavior: none;
    position: fixed;
    inset: 0;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    background: #0a0e17;
    color: #e8ecf1;
    -webkit-font-smoothing: antialiased;
  }

  .app {
    height: 100%;
    width: 100%;
    position: relative;
    overflow: hidden;
  }

  /* ===== SCREENS ===== */
  .screen {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    transition: opacity 0.25s ease, transform 0.25s ease;
    overflow: hidden;
  }

  .screen.hidden {
    opacity: 0;
    pointer-events: none;
    transform: translateY(10px);
  }

  /* ===== SCREEN 1: CREATE ACCOUNT (centered) ===== */
  .create-screen {
    justify-content: center;
    align-items: center;
    padding: 0 32px;
  }

  .create-inner {
    width: 100%;
    max-width: 360px;
    text-align: center;
  }

  .create-icon {
    width: 76px;
    height: 76px;
    border-radius: 22px;
    background: linear-gradient(135deg, #1a73e8, #0d47a1);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 2.2rem;
    margin: 0 auto 28px;
    box-shadow: 0 12px 32px rgba(26, 115, 232, 0.4);
  }

  .create-screen h1 {
    font-size: 1.9rem;
    font-weight: 700;
    letter-spacing: -0.03em;
    margin-bottom: 8px;
    color: #ffffff;
    text-align: center;
  }

  .create-screen .sub {
    font-size: 0.9rem;
    color: #6b7a90;
    margin-bottom: 36px;
    line-height: 1.5;
    text-align: center;
  }

  .name-field {
    margin-bottom: 20px;
    text-align: left;
  }

  .name-field label {
    display: block;
    font-size: 0.72rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: #6b7a90;
    margin-bottom: 10px;
  }

  .name-field input {
    width: 100%;
    padding: 16px 18px;
    background: #161d2b;
    border: 1.5px solid #232d40;
    border-radius: 14px;
    font-size: 1rem;
    color: #e8ecf1;
    outline: none;
    transition: border-color 0.15s, background 0.15s;
    text-align: center;
  }

  .name-field input:focus {
    border-color: #1a73e8;
    background: #1a2233;
  }

  .name-field input::placeholder { color: #4a5568; }

  .btn-primary {
    width: 100%;
    padding: 16px;
    background: #1a73e8;
    color: white;
    border: none;
    border-radius: 14px;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s, transform 0.1s;
    font-family: inherit;
  }

  .btn-primary:hover { background: #1b66c9; }
  .btn-primary:active { transform: scale(0.98); }

  /* ===== SCREEN 2: BANK MAIN MENU ===== */
  .bank-screen {
    padding: 0;
    display: flex;
    flex-direction: column;
  }

  .bank-content {
    flex: 1;
    display: flex;
    flex-direction: column;
    padding: 0 22px;
    min-height: 0;
    overflow: hidden;
  }

  /* Top bar */
  .top-bar {
    padding: 22px 0 0;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .brand-mark {
    width: 34px;
    height: 34px;
    border-radius: 10px;
    background: linear-gradient(135deg, #1a73e8, #0d47a1);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1rem;
    font-weight: 800;
    color: white;
  }

  .brand-name {
    font-size: 1rem;
    font-weight: 700;
    letter-spacing: -0.01em;
    color: #ffffff;
  }

  .profile-btn {
    width: 38px;
    height: 38px;
    border-radius: 50%;
    background: #1a2233;
    border: 1.5px solid #232d40;
    color: #e8ecf1;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.9rem;
    font-weight: 700;
    cursor: pointer;
    transition: border-color 0.15s;
    font-family: inherit;
  }

  .profile-btn:hover { border-color: #1a73e8; }

  /* Greeting — centered */
  .greeting-row {
    padding: 24px 0 0;
    text-align: center;
  }

  .greeting-row small {
    font-size: 0.72rem;
    color: #6b7a90;
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 0.1em;
  }

  .greeting-row h2 {
    font-size: 1.4rem;
    font-weight: 700;
    letter-spacing: -0.02em;
    color: #ffffff;
    margin-top: 4px;
  }

  /* Balance card — centered text */
  .balance-card {
    margin: 18px 0 0;
    background: linear-gradient(145deg, #1a73e8 0%, #0d47a1 100%);
    border-radius: 22px;
    padding: 24px 22px;
    position: relative;
    overflow: hidden;
    box-shadow: 0 14px 36px rgba(13, 71, 161, 0.45);
    text-align: center;
  }

  .balance-card::before {
    content: '';
    position: absolute;
    top: -50px; right: -50px;
    width: 160px; height: 160px;
    background: rgba(255, 255, 255, 0.08);
    border-radius: 50%;
  }

  .balance-card::after {
    content: '';
    position: absolute;
    bottom: -60px; left: -30px;
    width: 140px; height: 140px;
    background: rgba(255, 255, 255, 0.05);
    border-radius: 50%;
  }

  .balance-card .card-label {
    font-size: 0.68rem;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    font-weight: 600;
    color: rgba(255, 255, 255, 0.7);
    margin-bottom: 6px;
    position: relative;
    z-index: 1;
  }

  .balance-card .card-amount {
    font-size: 2.4rem;
    font-weight: 700;
    letter-spacing: -0.03em;
    color: #ffffff;
    line-height: 1.1;
    position: relative;
    z-index: 1;
  }

  .balance-card .card-amount.negative { color: #ffb4b4; }

  .balance-card .card-row {
    display: flex;
    justify-content: center;
    gap: 40px;
    margin-top: 20px;
    position: relative;
    z-index: 1;
  }

  .card-stat { display: flex; flex-direction: column; gap: 3px; align-items: center; }

  .card-stat .stat-label {
    font-size: 0.65rem;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    font-weight: 600;
    color: rgba(255, 255, 255, 0.6);
  }

  .card-stat .stat-value {
    font-size: 0.95rem;
    font-weight: 700;
    color: #ffffff;
  }

  /* Quick actions */
  .quick-actions {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 10px;
    margin-top: 16px;
  }

  .action-btn {
    background: #161d2b;
    border: 1px solid #232d40;
    border-radius: 16px;
    padding: 14px 8px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 7px;
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s, transform 0.1s;
    font-family: inherit;
  }

  .action-btn:hover {
    background: #1a2233;
    border-color: #1a73e8;
  }

  .action-btn:active { transform: scale(0.96); }

  .action-icon {
    width: 38px;
    height: 38px;
    border-radius: 11px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.1rem;
  }

  .action-icon.blue { background: rgba(26, 115, 232, 0.15); }
  .action-icon.green { background: rgba(52, 199, 89, 0.15); }
  .action-icon.gray { background: rgba(255, 255, 255, 0.08); }

  .action-btn span.action-label {
    font-size: 0.7rem;
    font-weight: 600;
    color: #b8c2d0;
    letter-spacing: -0.01em;
  }

  /* Set balance */
  .set-balance-section {
    margin-top: 22px;
    text-align: center;
  }

  .section-title {
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    font-weight: 600;
    color: #6b7a90;
    margin-bottom: 10px;
  }

  .set-balance-row {
    display: flex;
    gap: 10px;
  }

  .set-balance-row input {
    flex: 1;
    padding: 14px 16px;
    background: #161d2b;
    border: 1.5px solid #232d40;
    border-radius: 14px;
    font-size: 0.95rem;
    color: #e8ecf1;
    outline: none;
    transition: border-color 0.15s;
    min-width: 0;
    text-align: center;
  }

  .set-balance-row input:focus { border-color: #1a73e8; }
  .set-balance-row input::placeholder { color: #4a5568; }

  .set-balance-row button {
    padding: 14px 22px;
    background: #1a73e8;
    color: white;
    border: none;
    border-radius: 14px;
    font-size: 0.86rem;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s;
    white-space: nowrap;
    font-family: inherit;
  }

  .set-balance-row button:hover { background: #1b66c9; }

  /* Recent */
  .recent-section {
    margin-top: 22px;
    flex: 1;
    min-height: 0;
    display: flex;
    flex-direction: column;
    padding-bottom: 22px;
  }

  .recent-header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 10px;
  }

  .recent-header .section-title { margin-bottom: 0; }

  .view-all-btn {
    background: none;
    border: none;
    color: #1a73e8;
    font-size: 0.75rem;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
    padding: 4px 2px;
  }

  .view-all-btn:hover { text-decoration: underline; }

  .recent-list {
    display: flex;
    flex-direction: column;
    gap: 2px;
    overflow: hidden;
    flex: 1;
    min-height: 0;
  }

  .recent-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 0;
    border-bottom: 1px solid #1a2233;
    flex-shrink: 0;
  }

  .recent-item:last-child { border-bottom: none; }

  .item-icon {
    width: 38px;
    height: 38px;
    border-radius: 11px;
    background: #161d2b;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.9rem;
    flex-shrink: 0;
    border: 1px solid #232d40;
  }

  .item-info {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 2px;
    min-width: 0;
  }

  .item-info .item-name {
    font-size: 0.88rem;
    font-weight: 600;
    color: #e8ecf1;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .item-info .item-date {
    font-size: 0.7rem;
    color: #6b7a90;
  }

  .item-amount {
    font-size: 0.88rem;
    font-weight: 700;
    color: #ff7b72;
    flex-shrink: 0;
  }

  .empty-recent {
    text-align: center;
    color: #4a5568;
    font-size: 0.82rem;
    padding: 22px 0;
  }
</style>
</head>
<body>

<div class="app">

  <!-- ===== CREATE ACCOUNT ===== -->
  <div class="screen create-screen" id="createScreen">
    <div class="create-inner">
      <div class="create-icon">🏦</div>
      <h1>JhoneVic Bank</h1>
      <p class="sub">Your personal budgeting account.</p>

      <div class="name-field">
        <label for="nameInput">Name</label>
        <input type="text" id="nameInput" placeholder="Full name" maxlength="30" autocomplete="off">
      </div>

      <button class="btn-primary" id="continueBtn">Continue</button>
    </div>
  </div>

  <!-- ===== BANK MAIN MENU ===== -->
  <div class="screen bank-screen hidden" id="bankScreen">
    <div class="bank-content">

      <div class="top-bar">
        <div class="brand">
          <div class="brand-mark">J</div>
          <span class="brand-name">JhoneVic Bank</span>
        </div>
        <button class="profile-btn" id="profileBtn" title="Switch account">·</button>
      </div>

      <div class="greeting-row">
        <small>Welcome back</small>
        <h2 id="userName">—</h2>
      </div>

      <div class="balance-card">
        <div class="card-label">Available Balance</div>
        <div class="card-amount" id="balanceDisplay">₱0.00</div>
        <div class="card-row">
          <div class="card-stat">
            <span class="stat-label">Spent</span>
            <span class="stat-value" id="spentDisplay">₱0.00</span>
          </div>
          <div class="card-stat">
            <span class="stat-label">Purchases</span>
            <span class="stat-value" id="countDisplay">0</span>
          </div>
        </div>
      </div>

      <div class="quick-actions">
        <button class="action-btn" id="addPurchaseBtn">
          <span class="action-icon blue">＋</span>
          <span class="action-label">Add</span>
        </button>
        <button class="action-btn" id="historyBtn">
          <span class="action-icon green">≡</span>
          <span class="action-label">History</span>
        </button>
        <button class="action-btn" id="resetBtn">
          <span class="action-icon gray">↺</span>
          <span class="action-label">Reset</span>
        </button>
      </div>

      <div class="set-balance-section">
        <div class="section-title">Set Balance</div>
        <div class="set-balance-row">
          <input type="number" id="startBalanceInput" placeholder="Amount" min="0" step="0.01">
          <button id="setBalanceBtn">Update</button>
        </div>
      </div>

      <div class="recent-section">
        <div class="recent-header">
          <span class="section-title">Recent</span>
          <button class="view-all-btn" id="viewAllBtn">View all</button>
        </div>
        <div class="recent-list" id="recentList">
          <div class="empty-recent">No transactions yet</div>
        </div>
      </div>

    </div>
  </div>

</div>

<script>
(function () {
  let userName = '';
  let startingBalance = 0;
  let expenses = [];
  const CURRENCY = '₱';

  const createScreen = document.getElementById('createScreen');
  const bankScreen = document.getElementById('bankScreen');
  const nameInput = document.getElementById('nameInput');
  const continueBtn = document.getElementById('continueBtn');
  const profileBtn = document.getElementById('profileBtn');
  const userNameEl = document.getElementById('userName');
  const balanceDisplay = document.getElementById('balanceDisplay');
  const spentDisplay = document.getElementById('spentDisplay');
  const countDisplay = document.getElementById('countDisplay');
  const startBalanceInput = document.getElementById('startBalanceInput');
  const setBalanceBtn = document.getElementById('setBalanceBtn');
  const addPurchaseBtn = document.getElementById('addPurchaseBtn');
  const historyBtn = document.getElementById('historyBtn');
  const resetBtn = document.getElementById('resetBtn');
  const viewAllBtn = document.getElementById('viewAllBtn');
  const recentList = document.getElementById('recentList');

  function formatMoney(n) {
    return CURRENCY + n.toLocaleString('en-PH', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }
  function totalSpent() { return expenses.reduce((s, e) => s + e.amount, 0); }
  function currentBalance() { return startingBalance - totalSpent(); }
  function formatDate(iso) {
    return new Date(iso).toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
  }

  function save() {
    localStorage.setItem('jhonevicBank', JSON.stringify({ userName, startingBalance, expenses }));
  }
  function load() {
    try {
      const raw = localStorage.getItem('jhonevicBank');
      if (!raw) return;
      const d = JSON.parse(raw);
      userName = d.userName || '';
      startingBalance = d.startingBalance || 0;
      expenses = Array.isArray(d.expenses) ? d.expenses : [];
    } catch (e) {}
  }

  function showCreate() {
    createScreen.classList.remove('hidden');
    bankScreen.classList.add('hidden');
    nameInput.value = userName;
    nameInput.focus();
  }

  function showBank() {
    createScreen.classList.add('hidden');
    bankScreen.classList.remove('hidden');
    render();
  }

  function render() {
    const balance = currentBalance();
    const spent = totalSpent();

    userNameEl.textContent = userName || '—';
    profileBtn.textContent = userName ? userName.charAt(0).toUpperCase() : '·';

    balanceDisplay.textContent = formatMoney(balance);
    balanceDisplay.classList.toggle('negative', balance < 0);
    spentDisplay.textContent = formatMoney(spent);
    countDisplay.textContent = expenses.length;

    const recent = [...expenses].sort((a, b) => b.id - a.id).slice(0, 3);
    if (recent.length === 0) {
      recentList.innerHTML = '<div class="empty-recent">No transactions yet</div>';
    } else {
      recentList.innerHTML = '';
      recent.forEach(exp => {
        const row = document.createElement('div');
        row.className = 'recent-item';

        const icon = document.createElement('div');
        icon.className = 'item-icon';
        icon.textContent = '🛍️';

        const info = document.createElement('div');
        info.className = 'item-info';
        const name = document.createElement('div');
        name.className = 'item-name';
        name.textContent = exp.name;
        const date = document.createElement('div');
        date.className = 'item-date';
        date.textContent = formatDate(exp.date);
        info.appendChild(name);
        info.appendChild(date);

        const amt = document.createElement('div');
        amt.className = 'item-amount';
        amt.textContent = '-' + formatMoney(exp.amount);

        row.appendChild(icon);
        row.appendChild(info);
        row.appendChild(amt);
        recentList.appendChild(row);
      });
    }
  }

  function createAccount() {
    const name = nameInput.value.trim();
    if (!name) { nameInput.focus(); return; }
    userName = name;
    save();
    showBank();
  }

  function setBalance() {
    const v = parseFloat(startBalanceInput.value);
    if (isNaN(v) || v <= 0) { startBalanceInput.focus(); return; }
    startingBalance = v;
    startBalanceInput.value = '';
    save();
    render();
  }

  function resetAll() {
    if (!confirm('Reset balance and all purchases?')) return;
    startingBalance = 0;
    expenses = [];
    save();
    render();
  }

  continueBtn.addEventListener('click', createAccount);
  nameInput.addEventListener('keypress', e => { if (e.key === 'Enter') createAccount(); });

  profileBtn.addEventListener('click', () => {
    if (confirm('Switch account?')) showCreate();
  });

  setBalanceBtn.addEventListener('click', setBalance);
  startBalanceInput.addEventListener('keypress', e => { if (e.key === 'Enter') setBalance(); });

  resetBtn.addEventListener('click', resetAll);

  addPurchaseBtn.addEventListener('click', () => alert('→ Add Purchase screen'));
  historyBtn.addEventListener('click', () => alert('→ Full History screen'));
  viewAllBtn.addEventListener('click', () => alert('→ Full History screen'));

  load();
  if (userName) showBank();
  else showCreate();
})();
</script>

</body>
</html>
